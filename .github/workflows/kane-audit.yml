name: Kane CLI Integrity Verification & Build Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  kane-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Application
        run: npm run build

      - name: Start Track App in Background
        run: npm run start &
        env:
          PORT: 3000

      - name: Wait for App to be Ready
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run Kane CLI Behind-Closed-Doors Mathematical Integrity Audit
        run: npx @testmuai/kane-cli run --config .kane/config.json .kane/tests/duplicate-audit.json
