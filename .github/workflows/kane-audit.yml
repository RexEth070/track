name: Kane CLI Integrity Verification & Build Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  kane-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Verification
        run: npx tsc --noEmit

      - name: Build Next.js Application
        run: npm run build

      - name: Run Kane Cross-Agent Mathematical Integrity Audit
        run: |
          npm run kane:audit
          node scripts/run-audit-simulator.js company_test_1k_13k.csv

      - name: Run Kane CLI Cloud Browser Verification (when credentials are configured)
        if: ${{ secrets.LT_USERNAME != '' && secrets.LT_ACCESS_KEY != '' }}
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
        run: |
          npm run start &
          npx wait-on http://localhost:3000 --timeout 60000
          npx kane-cli testmd run kane_integrity_test.md --url http://localhost:3000 --headless --agent --username "$LT_USERNAME" --access-key "$LT_ACCESS_KEY"
